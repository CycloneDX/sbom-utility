<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Content-Security-Policy — no inline scripts, no remote resources.
      'self' covers the Vite-bundled JS/CSS loaded from the app bundle.
      worker-src: none because we spawn child_process in main, not workers.
      To customise: edit the CSP in src/main/index.ts (applied via
      session.defaultSession.webRequest) rather than here; the header
      set at the HTTP layer takes precedence over this meta tag.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src  'self';
        style-src   'self' 'unsafe-inline';
        img-src     'self' data:;
        font-src    'self' data:;
        connect-src 'none';
        object-src  'none';
        base-uri    'none';
        frame-ancestors 'none';
      "
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SBOM Utility</title>
    <link rel="stylesheet" href="/src/renderer/styles/tokens.css" />
    <link rel="stylesheet" href="/src/renderer/styles/app.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
